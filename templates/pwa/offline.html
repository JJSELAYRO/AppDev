<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - QR Attendance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .offline-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .offline-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        
        .offline-icon svg {
            width: 60px;
            height: 60px;
            fill: white;
        }
        
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 12px;
        }
        
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        
        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
        }
        
        .info-box h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .info-box p {
            margin-bottom: 0;
            font-size: 14px;
        }
        
        .retry-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .retry-btn:hover {
            transform: scale(1.05);
        }
        
        .retry-btn:active {
            transform: scale(0.98);
        }
        
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .spinner.visible {
            display: inline-block;
        }
        
        .pending-badge {
            display: inline-block;
            background: #ffc107;
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24">
                <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.32 0-2.55.14-3.69.38L18.43 13.5 23.64 7zm-6.6 8.22L3.27 1.44 2 2.72l2.05 2.05C1.91 5.76.59 6.82.36 7l10.08 12.47c.14.19.36.29.6.29.25 0 .46-.1.61-.29l2.41-2.97 3.18 3.18 1.27-1.28-3.5-3.49zm-7.53 2.71l-2.41-2.97c-.14-.19-.36-.29-.6-.29-.25 0-.46.1-.61.29L.36 17c.24.18.65.58 1.87 1.08l5.61-3.36 2.25-2.22z"/>
            </svg>
        </div>
        
        <h1>You're Offline</h1>
        <p>Don't worry! Your attendance data will be saved and synced when you're back online.</p>
        
        <div class="info-box">
            <h3>Pending Sync</h3>
            <p>
                Attendance records waiting to sync: 
                <span class="pending-badge" id="pending-count">0</span>
            </p>
        </div>
        
        <div class="info-box">
            <h3>What You Can Do</h3>
            <p>
                • Continue scanning QR codes<br>
                • Attendance will be saved locally<br>
                • Data syncs automatically when online
            </p>
        </div>
        
        <button class="retry-btn" onclick="checkConnection()">
            <span class="spinner" id="spinner"></span>
            <span id="btn-text">Try Again</span>
        </button>
    </div>
    
    <script>
        // Update pending count
        function updatePendingCount() {
            const data = localStorage.getItem('qr_attendance_pending');
            const queue = data ? JSON.parse(data) : [];
            document.getElementById('pending-count').textContent = queue.length;
        }
        
        // Check connection
        function checkConnection() {
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btn-text');
            
            spinner.classList.add('visible');
            btnText.textContent = 'Checking...';
            
            fetch('/accounts/login/', { method: 'HEAD' })
                .then(() => {
                    window.location.href = '/dashboard/';
                })
                .catch(() => {
                    spinner.classList.remove('visible');
                    btnText.textContent = 'Still Offline. Try Again';
                });
        }
        
        // Listen for online event
        window.addEventListener('online', () => {
            window.location.href = '/dashboard/';
        });
        
        // Initial update
        updatePendingCount();
    </script>
</body>
</html>
